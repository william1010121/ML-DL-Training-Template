[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-dl-training-template"
version = "0.1.0"
description = "A reproducible, evidence-first PyTorch training template."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
cpu = ["torch==2.13.0", "torchvision==0.28.0"]
cuda = ["torch==2.13.0", "torchvision==0.28.0"]

[project.scripts]
mltrain = "mltrain.cli:main"
mltrain-runpod = "mltrain.runpod_transport:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mltrain", "src/ml_training_template"]

[tool.mltrain]
adapter = "ml_training_template.project:adapter"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mltrain", "ml_training_template"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "torch", "torch.*"]
follow_imports = "skip"
